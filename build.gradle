plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
    id 'io.freefair.lombok' version '9.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'


dependencies {
    implementation("org.junit.jupiter:junit-jupiter:5.10.0")
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation("com.codeborne:selenide:7.10.0")
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testImplementation("io.qameta.allure:allure-junit5:2.30.0")
    testImplementation("io.qameta.allure:allure-assertj:2.30.0")

    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    // testImplementation 'https://github.com/AlexanderOlegovichB/cinescope-api-steps/releases/tag/1.0.0'
    testImplementation 'com.github.AlexanderOlegovichB:cinescope-api-steps:1.0.1'

}

tasks.test {
    useJUnitPlatform()
    // Поддержка тегов через -Ptags=userTest
    if (project.hasProperty("tags")) {
        useJUnitPlatform {
            includeTags project.property("tags").toString()
        }
    }

    // Опционально: исключение тегов
    if (project.hasProperty("excludeTags")) {
        useJUnitPlatform {
            excludeTags project.property("excludeTags").toString()
        }
    }
}